<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap Split-View: Branch & History Directory</title>
    
    <!-- Leaflet CSS para sa Map View -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        .search-box {
            position: relative;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .search-box input {
            width: 100%;
            padding: 12px 35px 12px 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .search-box input:focus {
            border-color: #38bdf8;
        }
        #clearBtn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            display: none;
        }
        #clearBtn:hover {
            color: #fff;
        }
        #suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 0 0 8px 8px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
        }
        .suggestion-item {
            padding: 10px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #1e293b;
        }
        .suggestion-item:hover {
            background: #334155;
        }
        .suggestion-category {
            font-size: 10px;
            color: #38bdf8;
            text-transform: uppercase;
            font-weight: bold;
            padding: 4px 10px;
            background: #111827;
        }
        /* Split View Layout */
        .split-view {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        .view-pane {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #475569;
            background: #000;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .info-label {
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 4px;
            font-weight: bold;
        }
        /* Result Panel */
        .result-panel {
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
        }
        .result-panel h4 {
            margin: 0 0 8px 0;
            color: #38bdf8;
            font-size: 14px;
        }
        .result-item {
            margin-bottom: 6px;
            word-break: break-all;
        }
        .result-item span {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3 style="margin-top:0; text-align:center;">🗺️ ShareMap Branch & History Finder</h3>
        <p style="font-size: 12px; color: #94a3b8; text-align:center;">Maghanap ng Store Branch, Landmark, o tingnan ang iyong Search History.</p>

        <!-- Search Input Bar -->
        <div class="search-box">
            <input type="text" id="addressInput" placeholder="Mag-type ng store branch o address..." autocomplete="off">
            <button id="clearBtn" title="Burahin">✕</button>
            <div id="suggestions"></div>
        </div>

        <!-- Split View Container -->
        <div class="split-view">
            <div>
                <div class="info-label">📍 Map View (Interactive)</div>
                <div class="view-pane">
                    <div id="map"></div>
                </div>
            </div>

            <div>
                <div class="info-label">📸 Street View Preview</div>
                <div class="view-pane">
                    <iframe id="streetViewFrame" src="" allowfullscreen></iframe>
                </div>
            </div>
        </div>

        <!-- Result Info Panel -->
        <div class="result-panel">
            <h4>📍 Pin Location Details</h4>
            <div class="result-item"><span>Digital Address (PlusCode):</span> <strong id="resPlusCode">Kinukuha...</strong></div>
            <div class="result-item"><span>Map link address:</span> <a id="resMapLink" href="#" target="_blank" style="color: #38bdf8;">-</a></div>
            <div class="result-item"><span>Geo address:</span> <strong id="resGeo">-</strong></div>
            <div class="result-item"><span>Text Address (OSM):</span> <strong id="resTextAddr">-</strong></div>
        </div>
    </div>

    <!-- Leaflet JS para sa Map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const ALPHABET = "23456789CFGHJMPQRVWX";

        // 1. PRE-LOADED STORE & BUSINESS BRANCHES DIRECTORY (Dito mo ilalagay ang mga branches mo)
        const storeBranches = [
            { name: "Pico Bakehouse - Lucena Main", lat: 13.9350, lng: 121.6100, category: "Registered Business" },
            { name: "ShareMap Kiosk Hub - SM Lucena Branch", lat: 13.9312, lng: 121.6135, category: "Store Branch" },
            { name: "ShareMap Central Office - Pacific Mall", lat: 13.9401, lng: 121.6150, category: "Store Branch" },
            { name: "Lucena Public Market Food Station", lat: 13.9370, lng: 121.6080, category: "Landmark" }
        ];

        function encodeStandardPlusCode(lat, lng) {
            lat = Math.min(Math.max(lat, -90), 90);
            lng = ((lng + 180) % 360 + 360) % 360 - 180;
            if (lat === 90) lat = 89.999999;

            let latVal = lat + 90;
            let lngVal = lng + 180;
            let code = "";
            let latPlace = 20;
            let lngPlace = 20;

            for (let i = 0; i < 4; i++) {
                let d1 = Math.floor(latVal / latPlace);
                let d2 = Math.floor(lngVal / lngPlace);
                latVal -= d1 * latPlace;
                lngVal -= d2 * lngPlace;
                code += ALPHABET.charAt(d1) + ALPHABET.charAt(d2);
                latPlace /= 20;
                lngPlace /= 20;
            }
            code += "+";
            let d1 = Math.floor(latVal / latPlace);
            let d2 = Math.floor(lngVal / lngPlace);
            code += ALPHABET.charAt(d1) + ALPHABET.charAt(d2);
            return code;
        }

        async function getStreetAddress(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`, {
                    headers: { 'User-Agent': 'ShareMapDeliveryApp/1.0' }
                });
                const data = await response.json();
                
                if (data && data.address) {
                    const a = data.address;
                    const houseNo = a.house_number || "";
                    const road = a.road || a.pedestrian || a.path || "";
                    const suburb = a.suburb || a.neighbourhood || a.village || "";
                    const city = a.city || a.town || a.municipality || "";
                    const province = a.province || a.state || "";
                    const country = a.country || "";

                    const addressParts = [houseNo ? `${houseNo} ${road}` : road, suburb, city, province, country]
                        .map(part => part.trim())
                        .filter(part => part.length > 0);
                    
                    return addressParts.join(", ");
                }
            } catch (err) {
                console.log("Reverse geocoding error:", err);
            }
            return "Custom Pinned Location";
        }

        let currentLat = 13.9373;
        let currentLng = 121.6171;

        const map = L.map('map').setView([currentLat, currentLng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let marker = L.marker([currentLat, currentLng], {draggable: true}).addTo(map);

        function updateStreetView(lat, lng) {
            const fallbackUrl = `https://maps.google.com/maps?q=&layer=c&cbll=${lat},${lng}&cbp=12,0,0,0,5&output=svembed`;
            document.getElementById('streetViewFrame').src = fallbackUrl;
        }

        async function updateDetails(lat, lng, customDisplayName = null) {
            const plusCode = encodeStandardPlusCode(lat, lng);
            const mapLink = `https://maps.google.com/?q=${lat},${lng}`;
            const geoStr = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;

            document.getElementById('resPlusCode').innerText = plusCode;
            
            const linkEl = document.getElementById('resMapLink');
            linkEl.href = mapLink;
            linkEl.innerText = mapLink;

            document.getElementById('resGeo').innerText = geoStr;
            
            if (customDisplayName) {
                document.getElementById('resTextAddr').innerText = customDisplayName;
                saveSearchHistory(customDisplayName, lat, lng);
            } else {
                document.getElementById('resTextAddr').innerText = "Kinukuha ang detalyadong address...";
                const detailedAddr = await getStreetAddress(lat, lng);
                document.getElementById('resTextAddr').innerText = detailedAddr;
                saveSearchHistory(detailedAddr, lat, lng);
            }
        }

        // 2. SEARCH HISTORY LOCALSTORAGE HANDLER
        function saveSearchHistory(name, lat, lng) {
            let history = JSON.parse(localStorage.getItem('sharemap_search_history') || '[]');
            // Iwas duplicate
            history = history.filter(item => item.name !== name);
            history.unshift({ name, lat, lng });
            if (history.length > 5) history.pop(); // Hanggang 5 huling search lang
            localStorage.setItem('sharemap_search_history', JSON.stringify(history));
        }

        function getSearchHistory() {
            return JSON.parse(localStorage.getItem('sharemap_search_history') || '[]');
        }

        // Initial Load
        updateStreetView(currentLat, currentLng);
        updateDetails(currentLat, currentLng, "Lucena City Center, Quezon, Philippines");

        const addressInput = document.getElementById('addressInput');
        const clearBtn = document.getElementById('clearBtn');
        const suggestionsBox = document.getElementById('suggestions');

        addressInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearBtn.style.display = query.length > 0 ? "block" : "none";
        });

        clearBtn.addEventListener('click', function() {
            addressInput.value = "";
            clearBtn.style.display = "none";
            suggestionsBox.innerHTML = "";
            addressInput.focus();
        });

        let debounceTimer;
        addressInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const query = this.value.trim();
            
            if (query.length === 0) {
                suggestionsBox.innerHTML = "";
                return;
            }

            debounceTimer = setTimeout(async () => {
                suggestionsBox.innerHTML = "";
                const queryLower = query.toLowerCase();

                // A. I-filter ang mga Branch mula sa Store Directory
                const matchedBranches = storeBranches.filter(b => b.name.toLowerCase().includes(queryLower));
                if (matchedBranches.length > 0) {
                    const catHeader = document.createElement('div');
                    catHeader.className = 'suggestion-category';
                    catHeader.innerText = "🏢 Registered Branches & Businesses";
                    suggestionsBox.appendChild(catHeader);

                    matchedBranches.forEach(branch => {
                        const item = document.createElement('div');
                        item.className = 'suggestion-item';
                        item.innerText = branch.name;
                        item.onclick = () => {
                            addressInput.value = branch.name;
                            clearBtn.style.display = "block";
                            suggestionsBox.innerHTML = "";
                            map.setView([branch.lat, branch.lng], 17);
                            marker.setLatLng([branch.lat, branch.lng]);
                            updateStreetView(branch.lat, branch.lng);
                            updateDetails(branch.lat, branch.lng, branch.name);
                        };
                        suggestionsBox.appendChild(item);
                    });
                }

                // B. I-filter ang Search History ng User
                const history = getSearchHistory().filter(h => h.name.toLowerCase().includes(queryLower));
                if (history.length > 0) {
                    const histHeader = document.createElement('div');
                    histHeader.className = 'suggestion-category';
                    histHeader.innerText = "🕒 Search History / Recent Pins";
                    suggestionsBox.appendChild(histHeader);

                    history.forEach(hist => {
                        const item = document.createElement('div');
                        item.className = 'suggestion-item';
                        item.innerText = `📌 ${hist.name}`;
                        item.onclick = () => {
                            addressInput.value = hist.name;
                            clearBtn.style.display = "block";
                            suggestionsBox.innerHTML = "";
                            map.setView([hist.lat, hist.lng], 17);
                            marker.setLatLng([hist.lat, hist.lng]);
                            updateStreetView(hist.lat, hist.lng);
                            updateDetails(hist.lat, hist.lng, hist.name);
                        };
                        suggestionsBox.appendChild(item);
                    });
                }

                // C. OpenStreetMap Search para sa iba pang general address
                if (query.length >= 3) {
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=4&q=${encodeURIComponent(query)}`);
                        const data = await response.json();
                        
                        if (data.length > 0) {
                            const osmHeader = document.createElement('div');
                            osmHeader.className = 'suggestion-category';
                            osmHeader.innerText = "📍 OpenStreetMap Addresses";
                            suggestionsBox.appendChild(osmHeader);

                            data.forEach(place => {
                                const item = document.createElement('div');
                                item.className = 'suggestion-item';
                                item.innerText = place.display_name;
                                item.onclick = () => {
                                    const lat = parseFloat(place.lat);
                                    const lng = parseFloat(place.lon);
                                    addressInput.value = place.display_name;
                                    clearBtn.style.display = "block";
                                    suggestionsBox.innerHTML = "";
                                    map.setView([lat, lng], 17);
                                    marker.setLatLng([lat, lng]);
                                    updateStreetView(lat, lng);
                                    updateDetails(lat, lng, place.display_name);
                                };
                                suggestionsBox.appendChild(item);
                            });
                        }
                    } catch (err) {
                        console.error("OSM Search error:", err);
                    }
                }
            }, 300);
        });

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            marker.setLatLng([lat, lng]);
            updateStreetView(lat, lng);
            updateDetails(lat, lng);
        });

        marker.on('dragend', function(e) {
            const latLng = marker.getLatLng();
            updateStreetView(latLng.lat, latLng.lng);
            updateDetails(latLng.lat, latLng.lng);
        });
    </script>
</body>
</html>
