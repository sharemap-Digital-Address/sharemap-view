<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap Split-View: Map & Street View Preview</title>
    
    <!-- Leaflet CSS para sa Map View -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Open Location Code (Plus Code) Official JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/open-location-code@1.0.3/openlocationcode.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        .search-box {
            position: relative;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        .search-box input {
            width: 100%;
            padding: 12px 35px 12px 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .search-box input:focus {
            border-color: #38bdf8;
        }
        #clearBtn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            display: none;
        }
        #clearBtn:hover {
            color: #fff;
        }
        #suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 0 0 8px 8px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 9999;
            display: none;
        }
        .suggestion-item {
            padding: 10px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #1e293b;
        }
        .suggestion-item:hover {
            background: #334155;
        }
        .suggestion-item.history {
            color: #38bdf8;
        }
        .suggestion-item.gmaps {
            color: #38bdf8;
            font-weight: bold;
            background: #0b2239;
        }
        /* Dedikadong Plus Code Bar */
        .pluscode-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .pluscode-bar input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            background-color: #0b2239;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .pluscode-bar button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .pluscode-bar button:hover {
            background: #0ea5e9;
        }
        .split-view {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        .view-pane {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #475569;
            background: #000;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .info-label {
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .result-panel {
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
        }
        .result-panel h4 {
            margin: 0 0 8px 0;
            color: #38bdf8;
            font-size: 14px;
        }
        .result-item {
            margin-bottom: 6px;
            word-break: break-all;
        }
        .result-item span {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3 style="margin-top:0; text-align:center;">🗺️ ShareMap Split-View Finder</h3>
        <p style="font-size: 12px; color: #94a3b8; text-align:center;">Maghanap gamit ang Plus Code o General Address.</p>

        <!-- Dedikadong Plus Code Quick Search Box -->
        <div class="pluscode-bar">
            <input type="text" id="plusCodeInput" placeholder="Ilagay ang Plus Code dito (e.g. 7Q53WJQ4+FG)..." autocomplete="off">
            <button onclick="handlePlusCodeSearch()">Go to Plus Code</button>
        </div>

        <!-- General Search Input Bar (OSM / History / Store) -->
        <div class="search-box">
            <input type="text" id="addressInput" placeholder="O mag-type ng address, establishment o geo coordinates..." autocomplete="off">
            <button id="clearBtn" title="Burahin">✕</button>
            <div id="suggestions"></div>
        </div>

        <!-- Split View Container -->
        <div class="split-view">
            <div>
                <div class="info-label">📍 Map View (Interactive)</div>
                <div class="view-pane">
                    <div id="map"></div>
                </div>
            </div>

            <div>
                <div class="info-label">📸 Street View Preview</div>
                <div class="view-pane">
                    <iframe id="streetViewFrame" src="" allowfullscreen></iframe>
                </div>
            </div>
        </div>

        <!-- Result Info Panel -->
        <div class="result-panel">
            <h4>📍 Pin Location Details</h4>
            <div class="result-item"><span>Digital Address (PlusCode):</span> <strong id="resPlusCode">Kinukuha...</strong></div>
            <div class="result-item"><span>Map link address:</span> <a id="resMapLink" href="#" target="_blank" style="color: #38bdf8;">-</a></div>
            <div class="result-item"><span>Geo address:</span> <strong id="resGeo">-</strong></div>
            <div class="result-item"><span>Text Address (OSM):</span> <strong id="resTextAddr">-</strong></div>
        </div>
    </div>

    <!-- Leaflet JS para sa Map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const ALPHABET = "23456789CFGHJMPQRVWX";

        const storeDirectory = [
            { name: "Pico Bakehouse (Lucena Branch)", lat: 13.937800, lng: 121.606200, address: "Profugo St, Brgy. 5, Lucena City, Quezon" },
            { name: "SM City Lucena", lat: 13.937400, lng: 121.613200, address: "Maharlika Highway, Lucena City" },
            { name: "Pacific Mall Lucena", lat: 13.937000, lng: 121.614500, address: "Quezon Ave, Lucena City" }
        ];

        function getSearchHistory() {
            try {
                return JSON.parse(localStorage.getItem('sharemap_search_history')) || [];
            } catch(e) {
                return [];
            }
        }

        function saveToSearchHistory(item) {
            let history = getSearchHistory();
            history = history.filter(h => h.name.toLowerCase() !== item.name.toLowerCase());
            history.unshift(item);
            if (history.length > 10) history.pop();
            localStorage.setItem('sharemap_search_history', JSON.stringify(history));
        }

        function encodeStandardPlusCode(lat, lng) {
            lat = Math.min(Math.max(lat, -90), 90);
            lng = ((lng + 180) % 360 + 360) % 360 - 180;
            if (lat === 90) lat = 89.999999;

            let latVal = lat + 90;
            let lngVal = lng + 180;
            let code = "";
            let latPlace = 20;
            let lngPlace = 20;

            for (let i = 0; i < 4; i++) {
                let d1 = Math.floor(latVal / latPlace);
                let d2 = Math.floor(lngVal / lngPlace);
                latVal -= d1 * latPlace;
                lngVal -= d2 * lngPlace;
                code += ALPHABET.charAt(d1) + ALPHABET.charAt(d2);
                latPlace /= 20;
                lngPlace /= 20;
            }
            code += "+";
            let d1 = Math.floor(latVal / latPlace);
            let d2 = Math.floor(lngVal / lngPlace);
            code += ALPHABET.charAt(d1) + ALPHABET.charAt(d2);
            return code;
        }

        async function getStreetAddress(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`, {
                    headers: { 'User-Agent': 'ShareMapDeliveryApp/1.0' }
                });
                const data = await response.json();
                
                if (data && data.address) {
                    const a = data.address;
                    const houseNo = a.house_number || "";
                    const road = a.road || a.pedestrian || a.path || "";
                    const suburb = a.suburb || a.neighbourhood || a.village || a.quarter || "";
                    const city = a.city || a.town || a.municipality || "";
                    const province = a.province || a.state || "";
                    const country = a.country || "";

                    const addressParts = [houseNo ? `${houseNo} ${road}` : road, suburb, city, province, country]
                        .map(part => part.trim())
                        .filter(part => part.length > 0);
                    
                    return addressParts.join(", ");
                }
            } catch (err) {
                console.log("Reverse geocoding error:", err);
            }
            return "Hindi nakuha ang detalye ng address";
        }

        function cleanGoogleAddress(text) {
            return text
                .replace(/\bcor\b|\bcorner\b/gi, '')
                .replace(/\b\d{4}\b/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // Tuwirang Plus Code Decoder gamit ang OLC library
        function decodeAndJumpPlusCode(query) {
            try {
                query = query.trim().toUpperCase();
                const match = query.match(/([2-9CFGHJMPQRVWX]{4,}\+[2-9CFGHJMPQRVWX]{2,})/i);
                if (match) {
                    let code = match[0];
                    let fullCode = code;

                    if (OpenLocationCode.isShort(code)) {
                        fullCode = OpenLocationCode.recoverNearest(code, currentLat, currentLng);
                    }

                    if (OpenLocationCode.isValid(fullCode)) {
                        const decoded = OpenLocationCode.decode(fullCode);
                        return { lat: decoded.latitudeCenter, lng: decoded.longitudeCenter, code: code };
                    }
                }
            } catch(e) {
                console.error("OLC Parse Error:", e);
            }
            return null;
        }

        let currentLat = 13.9373;
        let currentLng = 121.6171;

        const map = L.map('map', { zoomControl: false }).setView([currentLat, currentLng], 15);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let marker = L.marker([currentLat, currentLng], {draggable: true}).addTo(map);

        function updateStreetView(lat, lng) {
            const fallbackUrl = `https://maps.google.com/maps?q=&layer=c&cbll=${lat},${lng}&cbp=12,0,0,0,5&output=svembed`;
            document.getElementById('streetViewFrame').src = fallbackUrl;
        }

        async function updateDetails(lat, lng, customDisplayName = null) {
            currentLat = lat;
            currentLng = lng;
            const plusCode = encodeStandardPlusCode(lat, lng);
            const mapLink = `https://maps.google.com/?q=${lat},${lng}`;
            const geoStr = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;

            document.getElementById('resPlusCode').innerText = plusCode;
            
            const linkEl = document.getElementById('resMapLink');
            linkEl.href = mapLink;
            linkEl.innerText = mapLink;

            document.getElementById('resGeo').innerText = geoStr;
            
            if (customDisplayName) {
                document.getElementById('resTextAddr').innerText = customDisplayName;
            } else {
                document.getElementById('resTextAddr').innerText = "Kinukuha ang detalyadong address...";
                const detailedAddr = await getStreetAddress(lat, lng);
                document.getElementById('resTextAddr').innerText = detailedAddr;
            }
        }

        // Handler para sa dedikadong Plus Code button & Enter key
        function handlePlusCodeSearch() {
            const inputVal = document.getElementById('plusCodeInput').value;
            const result = decodeAndJumpPlusCode(inputVal);
            if (result) {
                map.setView([result.lat, result.lng], 17);
                marker.setLatLng([result.lat, result.lng]);
                updateStreetView(result.lat, result.lng);
                updateDetails(result.lat, result.lng, `Plus Code: ${result.code}`);
                saveToSearchHistory({ name: `Plus Code: ${result.code}`, lat: result.lat, lng: result.lng });
            } else {
                alert("Hindi wastong Plus Code. Subukang i-type muli.");
            }
        }

        document.getElementById('plusCodeInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                handlePlusCodeSearch();
            }
        });

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    map.setView([currentLat, currentLng], 17);
                    marker.setLatLng([currentLat, currentLng]);
                    updateStreetView(currentLat, currentLng);
                    updateDetails(currentLat, currentLng);
                },
                (error) => {
                    updateStreetView(currentLat, currentLng);
                    updateDetails(currentLat, currentLng, "Lucena City Center, Quezon, Philippines");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            updateStreetView(currentLat, currentLng);
            updateDetails(currentLat, currentLng, "Lucena City Center, Quezon, Philippines");
        }

        const addressInput = document.getElementById('addressInput');
        const clearBtn = document.getElementById('clearBtn');
        const suggestionsBox = document.getElementById('suggestions');

        addressInput.addEventListener('focus', function() {
            if (this.value.trim().length === 0) {
                suggestionsBox.style.display = "none";
            }
        });

        addressInput.addEventListener('blur', function() {
            setTimeout(() => {
                suggestionsBox.style.display = "none";
            }, 200);
        });

        clearBtn.addEventListener('click', function() {
            addressInput.value = "";
            clearBtn.style.display = "none";
            suggestionsBox.style.display = "none";
            addressInput.focus();
        });

        let debounceTimer;
        addressInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearBtn.style.display = query.length > 0 ? "block" : "none";
            
            if (query.length === 0) {
                suggestionsBox.innerHTML = "";
                suggestionsBox.style.display = "none";
                return;
            }

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(async () => {
                suggestionsBox.innerHTML = "";
                let hasResults = false;
                const lowerQuery = query.toLowerCase();

                // 1. FILTERED RECENT SEARCHES
                const history = getSearchHistory();
                const matchedHistory = history.filter(h => h.name.toLowerCase().includes(lowerQuery));
                
                if (matchedHistory.length > 0) {
                    hasResults = true;
                    const header = document.createElement('div');
                    header.style.cssText = 'padding: 6px 10px; font-size: 11px; color: #38bdf8; background: #0b0f19;';
                    header.innerText = '🕒 Filtered Recent Searches:';
                    suggestionsBox.appendChild(header);

                    matchedHistory.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item history';
                        div.innerText = `⭐ ${item.name}`;
                        div.onclick = () => {
                            addressInput.value = item.name;
                            clearBtn.style.display = "block";
                            suggestionsBox.style.display = "none";

                            map.setView([item.lat, item.lng], 17);
                            marker.setLatLng([item.lat, item.lng]);
                            updateStreetView(item.lat, item.lng);
                            updateDetails(item.lat, item.lng, item.name);
                        };
                        suggestionsBox.appendChild(div);
                    });
                }

                // 2. FILTERED STORE BRANCHES
                let matchedStores = storeDirectory.filter(s => s.name.toLowerCase().includes(lowerQuery) || s.address.toLowerCase().includes(lowerQuery));
                
                if (matchedStores.length > 0) {
                    hasResults = true;
                    matchedStores.forEach(store => {
                        const item = document.createElement('div');
                        item.className = 'suggestion-item';
                        item.style.color = '#4ade80';
                        item.innerText = `🏢 [Store Branch] ${store.name} - ${store.address}`;
                        item.onclick = () => {
                            addressInput.value = store.name;
                            clearBtn.style.display = "block";
                            suggestionsBox.style.display = "none";

                            map.setView([store.lat, store.lng], 17);
                            marker.setLatLng([store.lat, store.lng]);
                            updateStreetView(store.lat, store.lng);
                            updateDetails(store.lat, store.lng, `${store.name}, ${store.address}`);
                            
                            saveToSearchHistory({ name: store.name, lat: store.lat, lng: store.lng });
                        };
                        suggestionsBox.appendChild(item);
                    });
                }

                // 3. OPENSTREETMAP RESULTS
                try {
                    const cleanedSearch = cleanGoogleAddress(query);
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q=${encodeURIComponent(cleanedSearch)}`);
                    const data = await response.json();
                    
                    if (data.length > 0) {
                        hasResults = true;
                        data.forEach(place => {
                            const item = document.createElement('div');
                            item.className = 'suggestion-item';
                            item.innerText = place.display_name;
                            item.onclick = () => {
                                const lat = parseFloat(place.lat);
                                const lng = parseFloat(place.lon);
                                
                                addressInput.value = place.display_name;
                                clearBtn.style.display = "block";
                                suggestionsBox.style.display = "none";

                                map.setView([lat, lng], 17);
                                marker.setLatLng([lat, lng]);
                                updateStreetView(lat, lng);
                                updateDetails(lat, lng, place.display_name);

                                saveToSearchHistory({ name: place.display_name, lat: lat, lng: lng });
                            };
                            suggestionsBox.appendChild(item);
                        });
                    }
                } catch (err) {
                    console.error("Search error:", err);
                }

                // 4. GOOGLE MAPS FALLBACK
                if (!hasResults) {
                    const gmapsItem = document.createElement('div');
                    gmapsItem.className = 'suggestion-item gmaps';
                    gmapsItem.innerText = `🔍 Hanapin ang "${query}" sa Google Maps...`;
                    gmapsItem.onclick = () => {
                        window.open(`https://www.google.com/maps/search/${encodeURIComponent(query)}`, '_blank');
                        suggestionsBox.style.display = "none";
                    };
                    suggestionsBox.appendChild(gmapsItem);
                    hasResults = true;
                }

                if (hasResults) {
                    suggestionsBox.style.display = "block";
                } else {
                    suggestionsBox.style.display = "none";
                }
            }, 300);
        });

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            marker.setLatLng([lat, lng]);
            updateStreetView(lat, lng);
            updateDetails(lat, lng);
        });

        marker.on('dragend', function(e) {
            const latLng = marker.getLatLng();
            updateStreetView(latLng.lat, latLng.lng);
            updateDetails(latLng.lat, latLng.lng);
        });
    </script>
</body>
</html>
