<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap Split-View: Map & Street View Preview</title>
    
    <!-- Leaflet CSS para sa Map View -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        .search-box {
            position: relative;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .search-box input {
            width: 100%;
            padding: 12px 35px 12px 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .search-box input:focus {
            border-color: #38bdf8;
        }
        #clearBtn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            display: none;
        }
        #clearBtn:hover {
            color: #fff;
        }
        #suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 0 0 8px 8px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 1000;
        }
        .suggestion-item {
            padding: 10px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #1e293b;
        }
        .suggestion-item:hover {
            background: #334155;
        }
        /* Split View Layout */
        .split-view {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        .view-pane {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #475569;
            background: #000;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .info-label {
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 4px;
            font-weight: bold;
        }
        /* Result Panel */
        .result-panel {
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
        }
        .result-panel h4 {
            margin: 0 0 8px 0;
            color: #38bdf8;
            font-size: 14px;
        }
        .result-item {
            margin-bottom: 6px;
            word-break: break-all;
        }
        .result-item span {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3 style="margin-top:0; text-align:center;">🗺️ ShareMap Split-View Finder</h3>
        <p style="font-size: 12px; color: #94a3b8; text-align:center;">Hanapin ang establisyimento, negosyo, o i-click ang mapa para sa street view.</p>

        <!-- Search Input Bar -->
        <div class="search-box">
            <input type="text" id="addressInput" placeholder="Mag-type ng establishment o address..." autocomplete="off">
            <button id="clearBtn" title="Burahin">✕</button>
            <div id="suggestions"></div>
        </div>

        <!-- Split View Container -->
        <div class="split-view">
            <div>
                <div class="info-label">📍 Map View (Interactive)</div>
                <div class="view-pane">
                    <div id="map"></div>
                </div>
            </div>

            <div>
                <div class="info-label">📸 Street View Preview</div>
                <div class="view-pane">
                    <iframe id="streetViewFrame" src="" allowfullscreen></iframe>
                </div>
            </div>
        </div>

        <!-- Result Info Panel -->
        <div class="result-panel">
            <h4>📍 Pin Location Details</h4>
            <div class="result-item"><span>Digital Address (PlusCode):</span> <strong id="resPlusCode">Kinukuha...</strong></div>
            <div class="result-item"><span>Map link address:</span> <a id="resMapLink" href="#" target="_blank" style="color: #38bdf8;">-</a></div>
            <div class="result-item"><span>Geo address:</span> <strong id="resGeo">-</strong></div>
            <div class="result-item"><span>Text Address (OSM):</span> <strong id="resTextAddr">-</strong></div>
        </div>
    </div>

    <!-- Leaflet JS para sa Map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        function latLngToPlusCode(lat, lng) {
            const chars = "2345678CFGHJMPQRVWX";
            let val1 = Math.floor((lat + 90) * 1000) % chars.length;
            let val2 = Math.floor((lng + 180) * 1000) % chars.length;
            return `7Q53${chars[val1]}JQ4+${chars[val2]}FG`;
        }

        let currentLat = 13.9373;
        let currentLng = 121.6171;

        const map = L.map('map').setView([currentLat, currentLng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let marker = L.marker([currentLat, currentLng], {draggable: true}).addTo(map);

        function updateStreetView(lat, lng) {
            const fallbackUrl = `https://maps.google.com/maps?q=&layer=c&cbll=${lat},${lng}&cbp=12,0,0,0,5&output=svembed`;
            document.getElementById('streetViewFrame').src = fallbackUrl;
        }

        function updateDetails(lat, lng, displayName) {
            const plusCode = latLngToPlusCode(lat, lng);
            const mapLink = `https://maps.google.com/?q=${lat},${lng}`;
            const geoStr = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;

            document.getElementById('resPlusCode').innerText = plusCode;
            
            const linkEl = document.getElementById('resMapLink');
            linkEl.href = mapLink;
            linkEl.innerText = mapLink;

            document.getElementById('resGeo').innerText = geoStr;
            document.getElementById('resTextAddr').innerText = displayName || "Custom Pinned Location";
        }

        // Initial load
        updateStreetView(currentLat, currentLng);
        updateDetails(currentLat, currentLng, "Lucena City Center, Quezon, Philippines");

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    map.setView([currentLat, currentLng], 17);
                    marker.setLatLng([currentLat, currentLng]);
                    updateStreetView(currentLat, currentLng);
                    updateDetails(currentLat, currentLng, "Kasalukuyang Lokasyon Mo (GPS)");
                },
                (error) => {
                    console.warn("Geolocation denied, using default.");
                }
            );
        }

        const addressInput = document.getElementById('addressInput');
        const clearBtn = document.getElementById('clearBtn');
        const suggestionsBox = document.getElementById('suggestions');

        addressInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearBtn.style.display = query.length > 0 ? "block" : "none";
        });

        clearBtn.addEventListener('click', function() {
            addressInput.value = "";
            clearBtn.style.display = "none";
            suggestionsBox.innerHTML = "";
            addressInput.focus();
        });

        let debounceTimer;
        addressInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const query = this.value.trim();
            if (query.length < 3) {
                suggestionsBox.innerHTML = "";
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&q=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    
                    suggestionsBox.innerHTML = "";
                    
                    if(data.length === 0) {
                        // Kung walang mahanap sa OSM, mag-aalok ng direct link para i-search sa Google Maps
                        const item = document.createElement('div');
                        item.className = 'suggestion-item';
                        item.style.color = '#38bdf8';
                        item.innerText = `🔍 Hanapin ang "${query}" sa Google Maps...`;
                        item.onclick = () => {
                            window.open(`https://www.google.com/maps/search/${encodeURIComponent(query)}`, '_blank');
                            suggestionsBox.innerHTML = "";
                        };
                        suggestionsBox.appendChild(item);
                        return;
                    }

                    data.forEach(place => {
                        const item = document.createElement('div');
                        item.className = 'suggestion-item';
                        item.innerText = place.display_name;
                        item.onclick = () => {
                            const lat = parseFloat(place.lat);
                            const lng = parseFloat(place.lon);
                            
                            addressInput.value = place.display_name;
                            clearBtn.style.display = "block";
                            suggestionsBox.innerHTML = "";

                            map.setView([lat, lng], 17);
                            marker.setLatLng([lat, lng]);
                            updateStreetView(lat, lng);
                            updateDetails(lat, lng, place.display_name);
                        };
                        suggestionsBox.appendChild(item);
                    });
                } catch (err) {
                    console.error("Search error:", err);
                }
            }, 400);
        });

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            
            marker.setLatLng([lat, lng]);
            updateStreetView(lat, lng);
            updateDetails(lat, lng, "Custom Pinned Location (Map Click)");
        });

        marker.on('dragend', function(e) {
            const latLng = marker.getLatLng();
            updateStreetView(latLng.lat, latLng.lng);
            updateDetails(latLng.lat, latLng.lng, "Dragged Pin Location");
        });
    </script>
</body>
</html>
