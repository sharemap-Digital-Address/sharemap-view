<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Link Extractor - Same Tab Flow</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/open-location-code@1.0.2/openlocationcode.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    margin: 0;
    padding: 12px;
    display: flex;
    justify-content: center;
  }
  .container {
    max-width: 650px;
    width: 100%;
    background: #1e293b;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  h3 { text-align: center; margin: 5px 0 2px; font-size: 20px; color: #38bdf8; }
  .subtitle { font-size: 12px; color: #94a3b8; text-align: center; margin-bottom: 16px; }
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #38bdf8; font-weight: bold; margin-bottom: 6px; }
  .input-box { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #38bdf8;
    background: #0f172a; color: #fff; font-size: 14px; outline: none;
  }
  input[type="text"]:focus { border-color: #818cf8; }
  button {
    background: #38bdf8; color: #0f172a; border: 0; padding: 12px 18px;
    border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #7dd3fc; }
  #status {
    display: none; padding: 10px; margin: 10px 0; border-radius: 8px;
    font-size: 12px; white-space: pre-wrap; word-break: break-all;
  }
  #status.info { display: block; background: #1e293b; color: #bae6fd; border: 1px solid #0284c7; }
  #status.ok { display: block; background: #064e3b; color: #86efac; border: 1px solid #059669; }
  #status.error { display: block; background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
  
  .pane { height: 250px; border-radius: 8px; overflow: hidden; border: 1px solid #475569; background: #111827; margin-top: 10px; }
  #map { width: 100%; height: 100%; }
  
  .result-card {
    margin-top: 14px; padding: 12px; background: #0f172a; border: 1px solid #475569;
    border-radius: 8px; font-size: 13px;
  }
  .result-item { margin: 8px 0; word-break: break-all; }
  .result-item span { color: #94a3b8; display: block; font-size: 11px; margin-bottom: 2px; }
  .result-item strong { color: #38bdf8; font-size: 14px; }
  .url-preview {
    font-family: monospace; font-size: 11px; color: #cbd5e1; background: #1e293b;
    padding: 6px; border-radius: 4px; max-height: 60px; overflow-y: auto;
  }
</style>
</head>
<body>

<main class="container">
  <h3>🔗 Auto Link Extractor (Same-Tab Flow)</h3>
  <div class="subtitle">I-paste ang short link, pindutin ang Convert para buksan sa parehong tab, o i-paste ang expanded link para sa instant Regex detection.</div>

  <div class="form-group">
    <label for="linkInput">📌 Google Maps Link o Expanded URL:</label>
    <div class="input-box">
      <input type="text" id="linkInput" placeholder="I-paste ang link dito..." autocomplete="off">
      <button id="convertBtn">Convert / Open</button>
    </div>
  </div>

  <div id="status" role="status"></div>

  <section class="result-card">
    <strong style="color: #38bdf8; font-size: 14px;">📊 Extracted Results:</strong>
    <div class="result-item">
      <span>Latitude & Longitude:</span>
      <strong id="resGeo">—</strong>
    </div>
    <div class="result-item">
      <span>Generated Digital Address (Plus Code):</span>
      <strong id="resPlusCode" style="color: #4ade80;">—</strong>
    </div>
    <div class="result-item">
      <span>Processed URL:</span>
      <div id="resExpandedUrl" class="url-preview">—</div>
    </div>
  </section>

  <label style="margin-top: 14px;">📍 Pin Location Map:</label>
  <div class="pane"><div id="map"></div></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const status = $("status");
  const linkInput = $("linkInput");
  
  let currentLat = 13.9411, currentLng = 121.6230;

  const map = L.map("map", { zoomControl: false }).setView([currentLat, currentLng], 15);
  L.control.zoom({ position: "topright" }).addTo(map);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap"
  }).addTo(map);

  const marker = L.marker([currentLat, currentLng]).addTo(map);

  function showStatus(msg, type = "info") {
    status.className = type;
    status.textContent = msg;
  }

  function validCoords(lat, lng) {
    return Number.isFinite(lat) && Number.isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
  }

  function getPlusCode(lat, lng) {
    if (window.OpenLocationCode && typeof OpenLocationCode.encode === "function") {
      return OpenLocationCode.encode(lat, lng, 10);
    }
    return "N/A";
  }

  // Malupit at flexible na Regex para masalo ang lat/lng sa iba't ibang pormat ng URL
  function extractCoordsFromText(text) {
    if (!text) return null;
    
    // 1. Pattern para sa @lat,lng
    let m = text.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };

    // 2. Pattern para sa q=lat,lng o ll=lat,lng
    m = text.match(/[?&](?:q|ll|place|center)=(-?\d+\.\d+),(-?\d+\.\d+)/);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };

    // 3. Pattern para sa !3dlat!4dlng
    let latMatch = text.match(/!3d(-?\d+\.\d+)/);
    let lngMatch = text.match(/!4d(-?\d+\.\d+)/);
    if (latMatch && lngMatch) {
      return { lat: parseFloat(latMatch[1]), lng: parseFloat(lngMatch[2]) };
    }

    // 4. Pattern para sa /place/lat,lng
    m = text.match(/\/place\/(-?\d+\.\d+)(?:,|\+|\s+)(-?\d+\.\d+)/);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };

    return null;
  }

  function updateUI(lat, lng, urlText) {
    currentLat = lat;
    currentLng = lng;
    const plusCode = getPlusCode(lat, lng);

    $("resGeo").textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    $("resPlusCode").textContent = plusCode;
    $("resExpandedUrl").textContent = urlText;

    map.setView([lat, lng], 17);
    marker.setLatLng([lat, lng]);
    setTimeout(() => map.invalidateSize(), 200);
  }

  // REAL-TIME INPUT CHANGE LISTENER (Context Change / Text Watcher)
  linkInput.addEventListener("input", () => {
    const text = linkInput.value.trim();
    const coords = extractCoordsFromText(text);

    if (coords && validCoords(coords.lat, coords.lng)) {
      updateUI(coords.lat, coords.lng, text);
      showStatus("✅ Agarang na-detect at na-extract ang Lat/Lng at Plus Code!", "ok");
    } else if (text.length > 5 && (text.includes("goo.gl") || text.includes("maps.app"))) {
      showStatus("💡 Short link ang nakita. I-click ang 'Convert / Open' para buksan at kopyahin ang expanded URL.", "info");
    } else {
      showStatus("", "info");
      status.className = "";
    }
  });

  // CONVERT / OPEN BUTTON ACTION (Same-Tab Navigation)
  $("convertBtn").addEventListener("click", () => {
    const rawUrl = linkInput.value.trim();
    if (!rawUrl) {
      showStatus("⚠️ Maglagay muna ng link bago pindutin ang Convert.", "error");
      return;
    }

    // Kung may direktang coordinates na, i-extract agad nang hindi na lumilipat
    const coords = extractCoordsFromText(rawUrl);
    if (coords && validCoords(coords.lat, coords.lng)) {
      updateUI(coords.lat, coords.lng, rawUrl);
      showStatus("✅ Tagumpay na nakuha ang lokasyon!", "ok");
      return;
    }

    // Kung short link, buksan sa parehong tab para mabilis makuha ang buong URL
    if (rawUrl.includes("goo.gl") || rawUrl.includes("maps.app")) {
      showStatus("🌐 Binubuksan ang link sa parehong tab...", "info");
      setTimeout(() => {
        window.location.href = rawUrl;
      }, 500);
    } else {
      showStatus("❌ Hindi balidong Google Maps link.", "error");
    }
  });

  // Awtomatikong suriin kung sakaling may nai-paste nang link pag-load ng page
  if (linkInput.value.trim()) {
    linkInput.dispatchEvent(new Event('input'));
  }

  setTimeout(() => map.invalidateSize(), 300);
})();
</script>
</body>
</html>
